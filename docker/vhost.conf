ServerTokens Prod
ServerSignature Off
ServerName localhost
ErrorLog /dev/stderr
CustomLog /dev/stdout combined

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    # Tipo MIME oficial del manifest (iOS reciente es estricto con él).
    <Files "manifest.json">
        ForceType application/manifest+json
    </Files>

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        # Todo lo que no sea un fichero estático pasa por el front controller.
        FallbackResource /index.php
    </Directory>
</VirtualHost>
